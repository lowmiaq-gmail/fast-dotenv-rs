name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Create isolated CI virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install test and packaging tooling
        run: .venv/bin/python -m pip install --upgrade pip maturin "pytest>=8,<9" click ipython
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets
      - name: Build development extension
        run: maturin develop --release
      - name: Candidate drop-in and differential tests
        run: PYTHONPATH=python python -m pytest -q tests
      - name: Complete pinned python-dotenv 1.2.2 suite
        run: bash scripts/run_upstream_full.sh
      - name: Isolated 10,000-case differential gate
        run: PYTHONPATH=python python scripts/run_differential.py
      - name: Build wheel and source distribution
        run: |
          rm -rf wheelhouse
          mkdir -p wheelhouse
          maturin build --release --out wheelhouse
          maturin sdist --out wheelhouse
      - name: Audit wheel and sdist contents
        run: >-
          python scripts/inspect_python_artifacts.py
          --artifact-dir wheelhouse
          --repository-root "$GITHUB_WORKSPACE"
          --expected-name fast-dotenv-rs
          --expected-version 0.1.1
          --expected-wheels 1
          --expected-sdists 1
          --require-metadata-text "Requires-Dist: click>=5.0"
      - name: Fresh virtualenv wheel and CLI smoke test
        run: |
          python -m venv fresh-venv
          fresh-venv/bin/python -m pip install --upgrade pip
          fresh-venv/bin/python -m pip install wheelhouse/*.whl
          fresh-venv/bin/python - <<'PY'
          from io import StringIO

          import dotenv

          assert dotenv.__file__
          assert dotenv.dotenv_values(stream=StringIO("A=1\n"))["A"] == "1"
          print("fresh wheel import with default dependencies: passed")
          PY
          fresh-venv/bin/python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "dotenv", "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert "0.1.1" in result.stdout
          print("fresh default-install wheel import and CLI: passed")
          PY
          fresh-venv/bin/python scripts/check_installed_cli.py --version 0.1.1
      - name: Upload Linux wheel and sdist
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-python-${{ matrix.python-version }}
          path: wheelhouse/*

  packaging:
    name: wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install build tooling
        run: python -m pip install --upgrade pip maturin
      - name: Build release wheel
        run: maturin build --release --out wheelhouse
      - name: Install packaged wheel and verify import/CLI
        run: |
          python -c "import glob, subprocess, sys; wheels = glob.glob('wheelhouse/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -c "import dotenv; assert dotenv.dotenv_values(stream=__import__('io').StringIO('A=1\\n'))['A'] == '1'"
          python scripts/check_installed_cli.py --version 0.1.1
      - name: Complete upstream suite against installed wheel
        shell: bash
        run: |
          python -m pip install "pytest>=8,<9" "ipython>=8"
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          CANDIDATE_PYTHONPATH='' CANDIDATE_EXPECTED_ROOT="$candidate_root" PYTHON=python bash scripts/run_upstream_full.sh
      - name: Upload packaged wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
