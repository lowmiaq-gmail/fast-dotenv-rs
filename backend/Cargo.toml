[package]
name = "fast-dotenv-rs-backend"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Backend-only Rust binding for the fast-dotenv parser core"
repository = "https://github.com/lowmiaq-gmail/fast-dotenv-rs"
homepage = "https://github.com/lowmiaq-gmail/fast-dotenv-rs"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
fast-dotenv-core = { path = "../crates/fast-dotenv-core" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
